<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Junior Dashboard — to'xtatilgan</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2352514e'/%3E%3Ctext x='32' y='44' font-family='Arial,Helvetica,sans-serif' font-size='34' font-weight='700' text-anchor='middle' fill='%23fff'%3EJ%3C/text%3E%3C/svg%3E">
<style>
  :root{--page:#0e1116;--card:#161b22;--bd:#262c36;--txt:#e6e4df;--muted:#8d8f94}
  *{box-sizing:border-box;margin:0}
  body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px;background:var(--page);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
  .card{max-width:380px;width:100%;text-align:center;background:var(--card);border:0.5px solid var(--bd);border-radius:16px;padding:32px 24px}
  .ic{width:48px;height:48px;margin:0 auto 16px;border-radius:12px;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.06);font-size:22px}
  h1{font-size:18px;font-weight:600;margin-bottom:8px}
  p{font-size:13px;line-height:1.55;color:var(--muted)}
</style>
</head>
<body>
  <div class="card">
    <div class="ic">⏸</div>
    <h1>Junior Dashboard to'xtatilgan</h1>
    <p>Bu dashboard hozircha ishlamaydi. Savollar bo'lsa, administratorga murojaat qiling.</p>
  </div>
</body>
</html>
